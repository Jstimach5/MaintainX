services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: cmms
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmms -d cmms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cmms:${POSTGRES_PASSWORD:-change_me}@db:5432/cmms
      STORAGE_DIR: /data/storage
      PORT: 3000
    volumes:
      - storage_data:/data/storage
    ports:
      - "${PORT:-3000}:3000"
    command: sh -c "npm run db:migrate && npm run start"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DATABASE_URL: postgres://cmms:${POSTGRES_PASSWORD:-change_me}@db:5432/cmms
      STORAGE_DIR: /data/storage
    volumes:
      - storage_data:/data/storage
    command: npm run worker

volumes:
  db_data:
  storage_data:
